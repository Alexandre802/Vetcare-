name: Validar VetCare

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar arquivos do projeto
        run: |
          test -s index.html
          test -s apresentacao.html
          test -s hero.webp
          test -s clinic.webp
          test -s vercel.json
          ! grep -R "advocacia-premium\|Michel Food House" --exclude-dir=.git --exclude-dir=.github --exclude='README.md' --exclude='MIGRACAO.md' .
