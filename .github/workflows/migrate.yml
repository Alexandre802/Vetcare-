name: Migrar VetCare

on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar fonte legada
        run: git clone --depth 1 --branch main https://github.com/Alexandre802/teste.git /tmp/fonte

      - name: Copiar somente o VetCare
        run: |
          cp /tmp/fonte/public/vetcare/index.html ./index.html
          cp /tmp/fonte/public/vetcare/apresentacao.html ./apresentacao.html
          cp /tmp/fonte/public/vetcare/hero.webp ./hero.webp
          cp /tmp/fonte/public/vetcare/clinic.webp ./clinic.webp
          cat > vercel.json <<'EOF'
          {
            "cleanUrls": true,
            "trailingSlash": false
          }
          EOF

      - name: Registrar migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apresentacao.html hero.webp clinic.webp vercel.json
          git commit -m "Migra código e assets isolados do VetCare" || exit 0
          git push origin main
